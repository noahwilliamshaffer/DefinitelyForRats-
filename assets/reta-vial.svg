<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" role="img" aria-label="Sealed glass vial of lyophilized Retatrutide">
  <g fill="none" stroke="#1A1917" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- glass body: shoulder, neck, straight sides, radiused base -->
    <path d="M74 148 C74 132 96 122 96 104 L96 88 L144 88 L144 104 C144 122 166 132 166 148 L166 288 Q166 300 154 300 L86 300 Q74 300 74 288 Z"/>

    <!-- lyophilized cake sitting in the base -->
    <path d="M76 276 C98 269 142 282 164 274 L164 288 Q164 298 154 298 L86 298 Q76 298 76 288 Z"
          fill="#1A1917" fill-opacity=".11" stroke="none"/>
    <path d="M76 276 C98 269 142 282 164 274" stroke-width="1.25" stroke-opacity=".4"/>

    <!-- aluminium crimp over the stopper -->
    <rect x="88" y="56" width="64" height="38" rx="4"/>
    <path d="M93 66h54M93 75h54M93 84h54" stroke-width="1" stroke-opacity=".38"/>

    <!-- flip-off cap -->
    <rect x="98" y="32" width="44" height="26" rx="4"/>

    <!-- wrap label -->
    <rect x="74" y="196" width="92" height="78" fill="#1A1917" fill-opacity=".045" stroke-width="1.5"/>
    <path d="M84 208h72M84 214h44" stroke-width="1" stroke-opacity=".3"/>
    <path d="M84 254h72" stroke-width="1" stroke-opacity=".3"/>

    <!-- glass highlight -->
    <path d="M86 162V266" stroke-width="3.5" stroke-opacity=".09"/>
    <path d="M93 168V254" stroke-width="1.5" stroke-opacity=".07"/>
  </g>

  <g fill="#1A1917" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <text x="120" y="234" font-size="10.5" letter-spacing="1.15">RETATRUTIDE</text>
    <text x="120" y="266" font-size="6.8" letter-spacing="1.5" fill-opacity=".62">LYOPHILIZED POWDER</text>
  </g>
</svg>
