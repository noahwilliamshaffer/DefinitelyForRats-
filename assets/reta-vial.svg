<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" role="img" aria-label="Sealed glass vial of lyophilized Retatrutide">
  <g fill="none" stroke="#1A1917" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- glass body: short neck, tight shoulder, straight sides, radiused base -->
    <path d="M54 284V150q0-16 16-22l14-6q6-3 6-12V92h60v18q0 9 6 12l14 6q16 6 16 22v134q0 14-14 14H68q-14 0-14-14Z"/>

    <!-- lyophilized cake resting in the base -->
    <path d="M56 268c26-6 100 5 128-3v21q0 12-12 12H68q-12 0-12-12Z" fill="#1A1917" fill-opacity=".11" stroke="none"/>
    <path d="M56 268c26-6 100 5 128-3" stroke-width="1.4" stroke-opacity=".4"/>

    <!-- aluminium crimp, seated over the stopper and the neck flange -->
    <rect x="84" y="48" width="72" height="48" rx="4"/>
    <path d="M90 62h60M90 76h60" stroke-width="1.2" stroke-opacity=".34"/>

    <!-- flip-off cap -->
    <rect x="97" y="24" width="46" height="26" rx="4"/>

    <!-- wrap label -->
    <rect x="54" y="178" width="132" height="66" fill="#1A1917" fill-opacity=".045" stroke-width="1.6"/>
    <path d="M66 189h108M66 196h64" stroke-width="1.2" stroke-opacity=".28"/>
    <path d="M66 231h108" stroke-width="1.2" stroke-opacity=".28"/>

    <!-- glass highlight -->
    <path d="M68 158v100" stroke-width="4" stroke-opacity=".09"/>
    <path d="M78 164v88" stroke-width="1.8" stroke-opacity=".07"/>
  </g>

  <g fill="#1A1917" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <text x="120" y="216" font-size="15" letter-spacing="1.2">RETATRUTIDE</text>
    <text x="120" y="240" font-size="9" letter-spacing="1.5" fill-opacity=".6">LYOPHILIZED POWDER</text>
  </g>
</svg>
