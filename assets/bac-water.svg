<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" role="img" aria-label="Vial of bacteriostatic water">
  <g fill="none" stroke="#1A1917" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- glass body: same geometry as the peptide vial, slimmer barrel -->
    <path d="M62 284V150q0-16 16-22l14-6q4-3 4-12V92h48v18q0 9 4 12l14 6q16 6 16 22v134q0 14-14 14H76q-14 0-14-14Z"/>

    <!-- fill, with a meniscus -->
    <path d="M64 170c24-5 88 5 112-2v114q0 12-12 12H76q-12 0-12-12Z" fill="#1A1917" fill-opacity=".08" stroke="none"/>
    <path d="M64 170c24-5 88 5 112-2" stroke-width="1.4" stroke-opacity=".42"/>

    <!-- aluminium crimp and flip-off cap -->
    <rect x="90" y="48" width="60" height="48" rx="4"/>
    <path d="M96 62h48M96 76h48" stroke-width="1.2" stroke-opacity=".34"/>
    <rect x="101" y="24" width="38" height="26" rx="4"/>

    <!-- wrap label -->
    <rect x="62" y="186" width="116" height="66" fill="#1A1917" fill-opacity=".045" stroke-width="1.6"/>
    <path d="M74 197h92M74 204h56" stroke-width="1.2" stroke-opacity=".28"/>
    <path d="M74 239h92" stroke-width="1.2" stroke-opacity=".28"/>

    <!-- glass highlight -->
    <path d="M76 158v104" stroke-width="4" stroke-opacity=".09"/>
  </g>

  <g fill="#1A1917" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <text x="120" y="219" font-size="11" letter-spacing=".9">BACTERIOSTATIC</text>
    <text x="120" y="234" font-size="13.5" letter-spacing="3">WATER</text>
    <text x="120" y="248" font-size="8" letter-spacing="1.3" fill-opacity=".6">STERILE DILUENT</text>
  </g>
</svg>
