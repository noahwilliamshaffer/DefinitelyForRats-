<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" role="img" aria-label="Vial of bacteriostatic water">
  <g fill="none" stroke="#1A1917" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- glass body -->
    <path d="M82 142C82 126 100 118 100 102V86h40v16c0 16 18 24 18 40v146q0 12-12 12H94q-12 0-12-12Z"/>

    <!-- fill, with a meniscus -->
    <path d="M84 186c22-6 52 6 72-2v104q0 10-10 10H94q-10 0-10-10Z" fill="#1A1917" fill-opacity=".08" stroke="none"/>
    <path d="M84 186c22-6 52 6 72-2" stroke-width="1.25" stroke-opacity=".42"/>

    <!-- crimp and flip-off cap -->
    <rect x="92" y="54" width="56" height="36" rx="4"/>
    <path d="M97 64h46M97 72h46M97 80h46" stroke-width="1" stroke-opacity=".38"/>
    <rect x="101" y="32" width="38" height="24" rx="4"/>

    <!-- wrap label -->
    <rect x="82" y="206" width="76" height="72" fill="#1A1917" fill-opacity=".045" stroke-width="1.5"/>
    <path d="M91 217h58M91 223h34" stroke-width="1" stroke-opacity=".3"/>
    <path d="M91 262h58" stroke-width="1" stroke-opacity=".3"/>

    <!-- glass highlight -->
    <path d="M92 156V272" stroke-width="3.5" stroke-opacity=".09"/>
  </g>

  <g fill="#1A1917" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <text x="120" y="241" font-size="7.6" letter-spacing="1.05">BACTERIOSTATIC</text>
    <text x="120" y="253" font-size="9.5" letter-spacing="2.6">WATER</text>
    <text x="120" y="272" font-size="6.2" letter-spacing="1.3" fill-opacity=".6">STERILE DILUENT</text>
  </g>
</svg>
